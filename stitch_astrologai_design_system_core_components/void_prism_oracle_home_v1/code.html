<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Void Prism: Oracle Home V1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#9D4EDD",
                        "background-light": "#F8F9FA",
                        "background-dark": "#050505",
                        "neon-purple": "#BC4ED8",
                        "neon-cyan": "#00F5FF",
                        "neon-magenta": "#FF00E5",
                    },
                    fontFamily: {
                        display: ["Plus Jakarta Sans", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "12px",
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 12s linear infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        }
                    }
                },
            },
        };
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .neon-glow {
            box-shadow: 0 0 15px rgba(188, 78, 216, 0.3);
        }
        .prism-gradient {
            background: radial-gradient(circle at center, transparent 30%, #9D4EDD 70%, #FF00E5 100%);
            mix-blend-mode: screen;
        }
        .nebula-bg {
            background: radial-gradient(circle at 20% 30%, rgba(67, 97, 238, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(188, 78, 216, 0.15) 0%, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-body overflow-hidden">
<div class="fixed top-0 w-full h-12 flex items-center justify-between px-8 z-50 pointer-events-none">
<span class="text-sm font-semibold">9:41</span>
<div class="flex items-center gap-1.5">
<span class="material-symbols-rounded text-base">signal_cellular_alt</span>
<span class="material-symbols-rounded text-base">wifi</span>
<span class="material-symbols-rounded text-base">battery_full</span>
</div>
</div>
<main class="relative h-screen w-full flex flex-col items-center justify-between py-16 px-6 nebula-bg">
<header class="w-full flex items-center justify-between z-10">
<button class="w-10 h-10 flex items-center justify-center rounded-full glass-panel text-white/70 hover:text-white transition-colors">
<span class="material-symbols-rounded">menu</span>
</button>
<div class="flex flex-col items-center">
<span class="text-[10px] uppercase tracking-[0.2em] text-white/40 font-semibold">AstroLogAI</span>
<span class="text-xs text-white/60">V1.0.4</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full glass-panel text-white/70 hover:text-white transition-colors">
<span class="material-symbols-rounded">settings</span>
</button>
</header>
<div class="relative w-full flex flex-col items-center justify-center flex-grow">
<div class="relative w-72 h-72 md:w-80 md:h-80 flex items-center justify-center animate-float">
<div class="absolute inset-0 bg-primary/20 blur-[80px] rounded-full animate-pulse-slow"></div>
<div class="absolute inset-4 bg-neon-cyan/10 blur-[60px] rounded-full"></div>
<div class="relative w-full h-full rounded-full overflow-hidden border border-white/10 glass-panel shadow-2xl shadow-primary/20">
<div class="absolute inset-0 bg-black"></div>
<div class="absolute inset-0 opacity-80 mix-blend-screen animate-spin-slow" style="background: radial-gradient(circle at 30% 30%, #BC4ED8 0%, transparent 60%), radial-gradient(circle at 70% 70%, #00F5FF 0%, transparent 60%), radial-gradient(circle at 50% 50%, #FF00E5 0%, transparent 40%);"></div>
<div class="absolute inset-[25%] bg-black rounded-full blur-xl opacity-80"></div>
<div class="absolute inset-0 border-[0.5px] border-white/5 rounded-full scale-90"></div>
<div class="absolute inset-0 border-[0.5px] border-white/5 rounded-full scale-75 animate-pulse"></div>
<img alt="Ethereal Oracle Void Prism Avatar" class="absolute inset-0 w-full h-full object-cover mix-blend-color-dodge opacity-60" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAciyiHyIPzXVeKrB9AYAuB843QI4TlB18eDqBDwBTu0r95Yxwj1KDYH7j9azunhYrvRE7hph0IqpqQu13oFSgwq2_Oq8fCPnTsZKCG8-vbnT6ebELwgZd5WyUu7EFM7bjloVZ8ibf_QjKCpkxsmQyxjx5Fd2yAEkZzSpFxh_B58cGO6-2WXXnfwIPdxwnPU8wHZkkaBMT1G7DrfRpjOc63aYumob6PhCZddoAEeKH9XsTifH9rhSvzaIfyHvVt1NghOOkdYGcp8icO"/>
</div>
</div>
<div class="mt-12 text-center space-y-2">
<h1 class="text-3xl font-display font-light tracking-tight text-white">
                    Consult The <span class="text-transparent bg-clip-text bg-gradient-to-r from-neon-purple to-neon-cyan font-semibold">Oracle</span>
</h1>
<p class="text-white/40 text-sm font-light tracking-wide px-12">
                    Peer into the cosmic void for your personalized astrological insights.
                </p>
</div>
</div>
<footer class="w-full max-w-md pb-4 z-10">
<div class="relative group">
<div class="absolute -inset-1 bg-gradient-to-r from-primary/20 via-neon-magenta/20 to-neon-cyan/20 rounded-[32px] blur-md opacity-75 group-focus-within:opacity-100 transition-opacity"></div>
<div class="relative flex items-center h-16 bg-white/5 dark:bg-black/40 backdrop-blur-2xl border border-white/10 rounded-[32px] px-6 transition-all duration-300 focus-within:border-primary/50">
<input class="flex-grow bg-transparent border-none focus:ring-0 text-white placeholder-white/30 text-sm" placeholder="What does your future hold?" type="text"/>
<button class="ml-2 w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white shadow-lg shadow-primary/40 hover:scale-105 active:scale-95 transition-transform">
<span class="material-symbols-rounded text-[20px]">send</span>
</button>
</div>
</div>
<div class="flex justify-center mt-6 gap-3">
<button class="px-4 py-2 rounded-full glass-panel text-[11px] text-white/60 hover:text-white hover:bg-white/10 transition-all border border-white/5">
                    Daily Horoscope
                </button>
<button class="px-4 py-2 rounded-full glass-panel text-[11px] text-white/60 hover:text-white hover:bg-white/10 transition-all border border-white/5">
                    Birth Chart Analysis
                </button>
</div>
</footer>
<div class="absolute bottom-1 w-32 h-1 bg-white/20 rounded-full left-1/2 -translate-x-1/2"></div>
</main>
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute top-1/4 left-1/4 w-1 h-1 bg-white rounded-full opacity-20 animate-pulse"></div>
<div class="absolute top-1/2 right-1/4 w-1.5 h-1.5 bg-neon-cyan/30 rounded-full animate-pulse-slow" style="animation-delay: 1s;"></div>
<div class="absolute bottom-1/3 left-1/3 w-0.5 h-0.5 bg-white rounded-full opacity-40 animate-pulse" style="animation-delay: 2s;"></div>
</div>

</body></html>
